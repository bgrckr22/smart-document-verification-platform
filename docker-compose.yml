name: smart-document-platform

services:
  postgres:
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_document_db}
      POSTGRES_USER: ${POSTGRES_USER:-smartdocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smartdocs} -d ${POSTGRES_DB:-smart_document_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cv-service:
    build:
      context: .
      dockerfile: cv-service/Dockerfile
    environment:
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_IMAGE_PIXELS: ${MAX_IMAGE_PIXELS:-40000000}
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-smart_document_db};Username=${POSTGRES_USER:-smartdocs};Password=${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}"
      ComputerVision__BaseUrl: http://cv-service:8000
      ComputerVision__TimeoutSeconds: 60
      FileStorage__RootPath: /app/uploads
      Uploads__MaxBytes: ${MAX_UPLOAD_BYTES:-10485760}
      Cors__AllowedOrigins__0: "http://localhost:${FRONTEND_PORT:-3000}"
      Swagger__Enabled: "true"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - document_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      cv-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  document_uploads:
