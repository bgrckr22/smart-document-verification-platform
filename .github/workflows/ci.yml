name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test backend/SmartDocumentPlatform.sln --configuration Release

  computer-vision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cv-service/requirements-dev.txt
      - run: python -m pip install -r cv-service/requirements-dev.txt
      - run: python -m pytest tests/cv-service

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  compose-integration:
    needs: [backend, computer-vision, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start the full stack
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Exercise upload, processing, persistence, retrieval, and deletion
        run: python scripts/smoke-test.py
        env:
          SMOKE_BACKEND_URL: http://localhost:8080
          SMOKE_FRONTEND_URL: http://localhost:3000
          SMOKE_PUBLIC_API_URL: http://localhost:3000
      - name: Show container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
